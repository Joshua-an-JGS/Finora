<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FINORA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer wrapper providing padding for natural drop shadow on Windows */
    .splash-container {
      width: 500px;
      height: 340px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      box-shadow: 0 18px 42px -8px rgba(15, 23, 42, 0.12), 0 4px 14px -2px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      will-change: opacity, transform;
      transition: opacity 380ms cubic-bezier(0.4, 0, 0.2, 1), transform 380ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Exit animation state before transitioning to main login window */
    .splash-container.fade-exit {
      opacity: 0;
      transform: scale(0.985);
      pointer-events: none;
    }

    /* Main central content */
    .splash-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px 24px 32px;
    }

    /* 
      1. Primary Animation Container:
         - Fade In & Scale Reveal (800ms)
         - Subtle Breathing Effect after reveal (3.5s loop)
    */
    .logo-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      pointer-events: none;
      animation: logoReveal 800ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    /* Subtle breathing mode activated after initial reveal */
    .logo-container.breathing {
      animation: logoBreathe 3.6s ease-in-out infinite alternate;
    }

    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.96) translateZ(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateZ(0);
      }
    }

    @keyframes logoBreathe {
      0% {
        transform: scale(1) translateZ(0);
        opacity: 1;
      }
      100% {
        transform: scale(1.008) translateZ(0);
        opacity: 0.985;
      }
    }

    /* Official unchanged FINORA logo image */
    .logo-img {
      width: 290px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      position: relative;
      z-index: 1;
    }

    /* 
      Stage 3: Subtle Orange Light Sweep
      - Runs exactly ONCE starting at 800ms (duration 900ms)
      - Perfectly masked to the exact silhouette of the official FINORA logo
      - Gentle orange tint with soft white gleaming crest
    */
    .logo-sweep-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      -webkit-mask-image: url('../logo/splash%20logo.png');
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url('../logo/splash%20logo.png');
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      overflow: hidden;
      opacity: 0;
      animation: sweepGleam 950ms cubic-bezier(0.4, 0, 0.2, 1) 800ms 1 forwards;
    }

    .logo-sweep-beam {
      position: absolute;
      top: -20%;
      left: -100%;
      width: 70%;
      height: 140%;
      background: linear-gradient(
        105deg,
        rgba(244, 119, 33, 0) 0%,
        rgba(244, 119, 33, 0.14) 25%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(244, 119, 33, 0.22) 65%,
        rgba(244, 119, 33, 0) 100%
      );
      transform: skewX(-22deg) translateZ(0);
      will-change: transform;
      animation: sweepMove 950ms cubic-bezier(0.4, 0, 0.2, 1) 800ms 1 forwards;
    }

    @keyframes sweepGleam {
      0% {
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes sweepMove {
      0% {
        transform: translateX(0%) skewX(-22deg);
      }
      100% {
        transform: translateX(380%) skewX(-22deg);
      }
    }

    /* 3. Progress Bar Animation */
    .loading-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .progress-track {
      width: 260px;
      height: 3.5px;
      background: #E5E7EB;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #F47721 0%, #FF8A3D 100%);
      border-radius: 9999px;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
      will-change: width;
    }

    /* 4. Loading Status Animation with smooth 250ms fade transition */
    .status-container {
      margin-top: 12px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: #6B7280;
      letter-spacing: 0.15px;
      text-align: center;
      transition: opacity 250ms ease, transform 250ms ease, color 0.3s ease;
      opacity: 1;
      transform: translateY(0);
      will-change: opacity, transform;
    }

    .status-text.fade-out {
      opacity: 0;
      transform: translateY(-2px);
    }

    .status-text.error {
      color: #DC2626;
      font-weight: 600;
    }

    /* Bottom footer with subtle divider */
    .splash-footer {
      border-top: 1px solid #E5E7EB;
      padding: 13px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      -webkit-app-region: no-drag;
    }

    .footer-credit {
      font-size: 11.5px;
      color: #6B7280;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .footer-version {
      font-size: 11.5px;
      color: #6B7280;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.2px;
    }

    /* Accessibility: Respect user motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .logo-container,
      .logo-container.breathing,
      .logo-sweep-overlay,
      .logo-sweep-beam,
      .splash-container {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .logo-sweep-overlay {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splashContainer">
    <div class="splash-body">
      <!-- 
        Centered Official FINORA Logo
        Stage 1: Fade In (800ms)
        Stage 2: Gentle Scale Reveal (800ms)
        Stage 3: Subtle Orange Light Sweep (900ms)
      -->
      <div class="logo-container" id="logoContainer">
        <img
          class="logo-img"
          src="../logo/splash%20logo.png"
          alt="FINORA — Finance &amp; Payroll Management System"
        />
        <!-- Narrow, subtle orange light sweep overlay -->
        <div class="logo-sweep-overlay" id="sweepOverlay" aria-hidden="true">
          <div class="logo-sweep-beam"></div>
        </div>
      </div>

      <!-- Minimal slim loading progress bar & dynamic status -->
      <div class="loading-section">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-container">
          <div class="status-text" id="statusMessage">
            Starting FINORA...
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Footer: Designer Attribution & Dynamic Version -->
    <div class="splash-footer">
      <span class="footer-credit">Designed and Developed by Joshua Godson</span>
      <span class="footer-version" id="versionText">v1.0.0</span>
    </div>
  </div>

  <script>
    (function () {
      // 1. Resolve Dynamic Version (Never hardcoded)
      let resolvedVersion = null;

      // Method A: Query Parameter (?v=1.0.0)
      const urlParams = new URLSearchParams(window.location.search);
      const queryVer = urlParams.get('v');
      if (queryVer) {
        resolvedVersion = queryVer;
      }

      // Method B: IPC API from Electron Preload
      if (!resolvedVersion && window.electronAPI && typeof window.electronAPI.getAppVersion === 'function') {
        try {
          const apiVer = window.electronAPI.getAppVersion();
          if (apiVer) resolvedVersion = apiVer;
        } catch (e) {
          console.warn('Error reading app version via IPC:', e);
        }
      }

      // Format version as vX.Y.Z
      const versionEl = document.getElementById('versionText');
      if (resolvedVersion) {
        const cleanVer = String(resolvedVersion).trim().replace(/^v/i, '');
        versionEl.textContent = 'v' + cleanVer;
      } else {
        versionEl.textContent = 'v1.0.0';
      }

      // 2. Logo Reveal and Subtle Breathing Sequence
      const logoEl = document.getElementById('logoContainer');
      // After reveal (800ms) and light sweep (950ms) complete (~1750ms), activate gentle breathing
      setTimeout(() => {
        if (logoEl && !document.getElementById('splashContainer').classList.contains('fade-exit')) {
          logoEl.classList.add('breathing');
        }
      }, 1800);

      // 3. Status Transition Helper with subtle 250ms fade
      const statusEl = document.getElementById('statusMessage');
      function setStatus(text) {
        if (!statusEl || statusEl.textContent === text) return;
        statusEl.classList.add('fade-out');
        setTimeout(() => {
          statusEl.textContent = text;
          statusEl.classList.remove('fade-out');
        }, 220);
      }

      // 4. Loading Progress State Management (Clean Non-Technical Messages)
      const fillEl = document.getElementById('progressFill');
      const splashContainer = document.getElementById('splashContainer');

      const stages = [
        { pct: 15, msg: 'Starting FINORA...', delay: 0 },
        { pct: 45, msg: 'Preparing your workspace...', delay: 450 },
        { pct: 72, msg: 'Loading application...', delay: 1100 }
      ];

      stages.forEach(stage => {
        if (stage.delay === 0) {
          fillEl.style.width = stage.pct + '%';
          statusEl.textContent = stage.msg;
        } else {
          setTimeout(() => {
            if (!fillEl.dataset.completed && !fillEl.dataset.errored) {
              fillEl.style.width = stage.pct + '%';
              setStatus(stage.msg);
            }
          }, stage.delay);
        }
      });

      // 5. Final Animation: Transition to Login Window
      let hasCompleted = false;
      function handleAppReady() {
        if (hasCompleted) return;
        hasCompleted = true;
        fillEl.dataset.completed = 'true';

        // Stage 1: Complete progress bar & show 'Almost ready...'
        fillEl.style.width = '100%';
        setStatus('Almost ready...');

        // Stage 2: Brief pause (300ms) with full logo visible
        setTimeout(() => {
          // Stage 3: Smooth splash exit fade (350ms)
          splashContainer.classList.add('fade-exit');

          // Stage 4: Signal Electron main process to reveal login window
          setTimeout(() => {
            if (window.electronAPI && typeof window.electronAPI.onSplashFadeComplete === 'function') {
              window.electronAPI.onSplashFadeComplete();
            }
          }, 360);
        }, 300);
      }

      // Listen for Electron backend-ready event
      if (window.electronAPI && typeof window.electronAPI.onReady === 'function') {
        window.electronAPI.onReady(() => {
          handleAppReady();
        });
      }

      // Electron Initialization Error Listener
      if (window.electronAPI && typeof window.electronAPI.onInitError === 'function') {
        window.electronAPI.onInitError((errMsg) => {
          fillEl.dataset.errored = 'true';
          fillEl.style.background = '#DC2626';
          fillEl.style.width = '100%';
          statusEl.className = 'status-text error';
          statusEl.textContent = 'Initialization failed. Check logs.';
        });
      }
    })();
  </script>
</body>
</html>
