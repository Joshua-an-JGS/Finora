<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FINORA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer wrapper providing 10px margin for natural drop shadow on Windows */
    .splash-container {
      width: 500px;
      height: 340px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      box-shadow: 0 16px 38px -8px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Main central content */
    .splash-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px 24px 32px;
    }

    /* Centered official FINORA logo */
    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      pointer-events: none;
    }

    .logo-img {
      width: 290px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Progress and status section */
    .loading-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .progress-track {
      width: 260px;
      height: 3.5px;
      background: #E5E7EB;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #F47721 0%, #FF8A3D 100%);
      border-radius: 9999px;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
    }

    .status-text {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 500;
      color: #6B7280;
      letter-spacing: 0.15px;
      text-align: center;
      transition: color 0.3s ease;
      min-height: 18px;
    }

    .status-text.error {
      color: #DC2626;
      font-weight: 600;
    }

    /* Bottom footer with subtle divider */
    .splash-footer {
      border-top: 1px solid #E5E7EB;
      padding: 13px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      -webkit-app-region: no-drag;
    }

    .footer-credit {
      font-size: 11.5px;
      color: #6B7280;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .footer-version {
      font-size: 11.5px;
      color: #6B7280;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-body">
      <!-- Centered Official FINORA Logo from project logo folder -->
      <div class="logo-wrapper">
        <img
          class="logo-img"
          src="../logo/splash%20logo.png"
          alt="FINORA — Finance &amp; Payroll Management System"
        />
      </div>

      <!-- Minimal slim loading progress bar & dynamic status -->
      <div class="loading-section">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusMessage">
          Starting FINORA...
        </div>
      </div>
    </div>

    <!-- Bottom Footer: Designer Attribution & Dynamic Version -->
    <div class="splash-footer">
      <span class="footer-credit">Designed and Developed by Joshua Godson</span>
      <span class="footer-version" id="versionText">v1.0.0</span>
    </div>
  </div>

  <script>
    (function () {
      // 1. Resolve Dynamic Version (Never hardcoded)
      let resolvedVersion = null;

      // Method A: Query Parameter (?v=1.0.0)
      const urlParams = new URLSearchParams(window.location.search);
      const queryVer = urlParams.get('v');
      if (queryVer) {
        resolvedVersion = queryVer;
      }

      // Method B: IPC API from Electron Preload
      if (!resolvedVersion && window.electronAPI && typeof window.electronAPI.getAppVersion === 'function') {
        try {
          const apiVer = window.electronAPI.getAppVersion();
          if (apiVer) resolvedVersion = apiVer;
        } catch (e) {
          console.warn('Error reading app version via IPC:', e);
        }
      }

      // Format version as vX.Y.Z
      const versionEl = document.getElementById('versionText');
      if (resolvedVersion) {
        const cleanVer = String(resolvedVersion).trim().replace(/^v/i, '');
        versionEl.textContent = 'v' + cleanVer;
      } else {
        versionEl.textContent = 'v1.0.0';
      }

      // 2. Loading Progress State Management
      const fillEl = document.getElementById('progressFill');
      const statusEl = document.getElementById('statusMessage');

      const stages = [
        { pct: 15, msg: 'Starting FINORA...', delay: 0 },
        { pct: 45, msg: 'Preparing application...', delay: 450 },
        { pct: 72, msg: 'Loading workspace...', delay: 1100 },
        { pct: 88, msg: 'Loading workspace...', delay: 1800 }
      ];

      stages.forEach(stage => {
        if (stage.delay === 0) {
          fillEl.style.width = stage.pct + '%';
          statusEl.textContent = stage.msg;
        } else {
          setTimeout(() => {
            // Only update if not completed or errored
            if (!fillEl.dataset.completed && !fillEl.dataset.errored) {
              fillEl.style.width = stage.pct + '%';
              statusEl.textContent = stage.msg;
            }
          }, stage.delay);
        }
      });

      // 3. Electron Backend Ready Event Listener
      if (window.electronAPI && typeof window.electronAPI.onReady === 'function') {
        window.electronAPI.onReady(() => {
          fillEl.dataset.completed = 'true';
          fillEl.style.width = '100%';
          statusEl.textContent = 'Almost ready...';
        });
      }

      // 4. Electron Initialization Error Listener
      if (window.electronAPI && typeof window.electronAPI.onInitError === 'function') {
        window.electronAPI.onInitError((errMsg) => {
          fillEl.dataset.errored = 'true';
          fillEl.style.background = '#DC2626';
          fillEl.style.width = '100%';
          statusEl.className = 'status-text error';
          statusEl.textContent = 'Initialization failed. Check logs.';
        });
      }
    })();
  </script>
</body>
</html>
